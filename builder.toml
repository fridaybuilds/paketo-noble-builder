description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby, for every language version that had a noble build"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.159"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.15.1"
  version = "4.15.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.23.4"
  version = "4.23.4"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.15.0"
  version = "14.15.0"

