name: Resolve

# Moves snapshots.json to the latest upstream release and adds the snapshots needed to keep every language version
# available, then opens a pull request. Merging it publishes the new snapshots and revisions (see release.yml).

on:
  schedule:
  - cron: "17 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: resolve
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Resolve
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: go run ./cmd/noble-builder resolve

    - uses: peter-evans/create-pull-request@v8
      with:
        branch: automation/resolve
        delete-branch: true
        commit-message: Update snapshots
        title: Update snapshots
        body: |
          Updates `snapshots.json` to the latest upstream release and release history. Merging it publishes new
          snapshots, and new revisions of the snapshots whose builder changed.
