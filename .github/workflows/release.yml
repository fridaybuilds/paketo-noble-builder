name: Release

# Resolves the versions to publish (see `noble-builder resolve`), and publishes each one, oldest first: the builder
# image, then a commit on main with its builder.toml, snapshots.json and SUPPORTED_VERSIONS.md, tagged with the
# version. Then creates the GitHub releases that are missing and points the `latest` image tag at the newest version.

on:
  schedule:
  - cron: "17 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PACK_VERSION: "0.40.9"

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      LOCK: ${{ runner.temp }}/snapshots.json
    steps:
    - name: Check Docker Hub credentials
      id: credentials
      env:
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        if [ -z "${DOCKERHUB_TOKEN}" ]; then
          echo "::notice::The DOCKERHUB_TOKEN secret isn't set, nothing is published"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v7
      if: steps.credentials.outputs.enabled == 'true'
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v7
      if: steps.credentials.outputs.enabled == 'true'
      with:
        go-version-file: go.mod

    - name: Resolve
      id: resolve
      if: steps.credentials.outputs.enabled == 'true'
      run: |
        go build -o noble-builder ./cmd/noble-builder
        ./noble-builder resolve -lock "${LOCK}"

        published="$(mktemp)"
        if [ -f snapshots.json ]; then
          jq -r '.snapshots[].version' snapshots.json > "${published}"
        fi
        versions="$(jq -r '.snapshots[].version' "${LOCK}" | grep -vxF -f "${published}" || true)"
        echo "versions=$(echo ${versions})" >> "$GITHUB_OUTPUT"

    - uses: buildpacks/github-actions/setup-pack@v6.1.1
      if: steps.resolve.outputs.versions != ''
      with:
        pack-version: ${{ env.PACK_VERSION }}

    - uses: docker/login-action@v4
      if: steps.resolve.outputs.versions != ''
      with:
        username: ${{ vars.DOCKERHUB_USERNAME || 'fridaybuilds' }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publish
      if: steps.resolve.outputs.versions != ''
      env:
        VERSIONS: ${{ steps.resolve.outputs.versions }}
      run: |
        image="$(sed -n 's/^image = "\(.*\)"$/\1/p' overlay.toml)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # experimental enables multi-arch builders from the [[targets]] in builder.toml
        pack config experimental true

        for version in ${VERSIONS}; do
          echo "::group::${version}"
          ./noble-builder prepare -lock "${LOCK}" -version "${version}"
          pack builder create "${image}:${version}" --config builder.toml --publish

          git add builder.toml snapshots.json SUPPORTED_VERSIONS.md
          git commit --quiet --message "Release ${version}"
          git pull --quiet --rebase origin main
          git tag "${version}"
          git push --atomic origin HEAD:main "refs/tags/${version}"
          echo "::endgroup::"
        done

        docker buildx imagetools create --tag "${image}:latest" "${image}:${version}"

    - name: Create releases
      if: steps.credentials.outputs.enabled == 'true'
      run: |
        [ -f snapshots.json ] || exit 0

        released="$(mktemp)"
        gh release list --limit 1000 --json tagName --jq '.[].tagName' > "${released}"

        previous=""
        for version in $(jq -r '.snapshots[].version' snapshots.json); do
          if ! grep -qxF "${version}" "${released}"; then
            git show "${version}:builder.toml" > "${RUNNER_TEMP}/builder.toml"
            args=(-builder "${RUNNER_TEMP}/builder.toml")
            if [ -n "${previous}" ]; then
              git show "${previous}:builder.toml" > "${RUNNER_TEMP}/previous.toml"
              args+=(-previous "${RUNNER_TEMP}/previous.toml")
            fi
            ./noble-builder notes -lock snapshots.json -version "${version}" "${args[@]}" > "${RUNNER_TEMP}/notes.md"
            gh release create "${version}" --title "${version}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag --latest=false
          fi
          previous="${version}"
        done

        if [ -n "${previous}" ]; then
          gh release edit "${previous}" --latest
        fi
